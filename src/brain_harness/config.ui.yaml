# HarnessPlatform · Web UI 配置（交互模式）
#
# 设计原则改变：**不再用硬编码自问句"假装思考"**
#   —— 之前的 clock 源每 2 tick 重复 5 句预设台词，看起来在思考、实际是空转。
#   —— 现在改成：等待主人输入 → 有输入才思考 → 没输入就安静待机（NORM-1 的诚实版）。
#
# 用法: cd code && python -m brain_harness.cli run -c brain_harness/config.ui.yaml
# 打开: http://127.0.0.1:8765  → 在左下输入框发送文字

brain:
  seed: 1
  state_path: "run/ui2/brain.json"

pipeline:
  sources:
    # ★只保留两个"真实输入"通道，去掉自问句 clock
    - type: file
      path: "run/ui2/inbox.txt"
    # 主人可以在终端直接写：echo "你好" > run/ui2/inbox.txt
    # （但更推荐用 Web UI 的输入框）

  processors:
    - type: think
      task_type: general

  policies:
    - type: metrics
      every: 20
    # 睡眠：长时间没输入时，让大脑巩固（这才是睡眠该做的事）
    - type: sleep
      every: 60
      min_buffer: 2

  sinks:
    - type: webui
      port: 8765
      keep: 800
    - type: jsonl
      path: "run/ui2/outbox.jsonl"

recorder:
  path: "run/ui2/recorder.jsonl"
  snapshot_every: 100
